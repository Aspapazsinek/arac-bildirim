<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Araç Sahibine Ulaş</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; padding: 20px; background-color: #eef2f5; margin: 0; }
    .card { background: white; padding: 30px 20px; border-radius: 16px; box-shadow: 0 8px 20px rgba(0,0,0,0.1); max-width: 380px; margin: 40px auto; }
    h2 { color: #1a1a1a; margin-bottom: 8px; font-size: 22px; }
    p { color: #666; font-size: 14px; margin-bottom: 20px; }
    button { width: 100%; padding: 14px; margin: 8px 0; border: none; border-radius: 10px; background-color: #0088cc; color: white; font-size: 16px; font-weight: 600; cursor: pointer; }
    button:active { background-color: #006699; }
    #durum { margin-top: 15px; font-weight: bold; font-size: 15px; }
  </style>
</head>
<body>

<div class="card">
  <h2>🚘 Araç Sahibine Ulaş</h2>
  <p>Lütfen bildirim nedeninizi seçiniz:</p>
  
  <button onclick="mesajGonder('🚗 Hatalı Park / Yol Kapalı!')">🚗 Hatalı Park</button>
  <button onclick="mesajGonder('💡 Far veya Cam Açık!')">💡 Far / Cam Açık</button>
  <button onclick="mesajGonder('🚨 Acil Durum!')">🚨 Acil Durum</button>
  <button onclick="mesajGonder('⚠️ Araç Çekiliyor!')">⚠️ Araç Çekiliyor</button>

  <div id="durum"></div>
</div>

<script>
  function mesajGonder(mesaj) {
    const durumDiv = document.getElementById("durum");
    durumDiv.style.color = "#0088cc";
    durumDiv.innerText = "Gönderiliyor...";

    const token = "8983133222:AAGlc-Jc6BlFRxFDC_genU-ICp9k8A7rAVA";
    const chatId = "5056753936";
    const url = "https://api.telegram.org/bot" + token + "/sendMessage";
    
    fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        chat_id: chatId,
        text: "🚨 ARACINIZ İÇİN BİLDİRİM VAR!\n\nBildirim: " + mesaj
      })
    })
    .then(res => res.json())
    .then(data => {
      if(data.ok) {
        durumDiv.style.color = "#2e7d32";
        durumDiv.innerText = "✅ Bildirim araç sahibine iletildi!";
      } else {
        durumDiv.style.color = "#c62828";
        durumDiv.innerText = "❌ Hata oluştu!";
      }
    })
    .catch(() => {
      durumDiv.style.color = "#c62828";
      durumDiv.innerText = "❌ Bağlantı hatası!";
    });
  }
</script>

</body>
</html>

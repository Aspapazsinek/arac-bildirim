<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Araç Sahibine Ulaş</title>
  <style>
    body { font-family: sans-serif; text-align: center; padding: 20px; background-color: #f4f6f8; }
    .card { background: white; padding: 25px; border-radius: 12px; max-width: 350px; margin: auto; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    button { width: 100%; padding: 12px; margin: 8px 0; border: none; border-radius: 8px; background-color: #0088cc; color: white; font-size: 16px; font-weight: bold; cursor: pointer; }
    #durum { margin-top: 15px; font-weight: bold; }
  </style>
</head>
<body>

<div class="card">
  <h2>🚘 Araç Sahibine Ulaş</h2>
  <p>Bildirim nedeninizi seçiniz:</p>
  
  <button onclick="mesajGonder('🚗 Hatalı Park / Yol Kapalı!')">🚗 Hatalı Park</button>
  <button onclick="mesajGonder('💡 Far veya Cam Açık!')">💡 Far / Cam Açık</button>
  <button onclick="mesajGonder('🚨 Acil Durum!')">🚨 Acil Durum</button>
  <button onclick="mesajGonder('⚠️ Araç Çekiliyor!')">⚠️ Araç Çekiliyor</button>

  <div id="durum"></div>
</div>

<script>
  function mesajGonder(metin) {
    const durum = document.getElementById("durum");
    durum.style.color = "blue";
    durum.innerText = "Gönderiliyor...";

    const token = "8983133222:AAGlc-Jc6BlFRxFDC_genU-ICp9k8A7rAVA";
    const chatId = "5056753936";
    const url = "https://api.telegram.org/bot" + token + "/sendMessage";

    fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ chat_id: chatId, text: "🚨 ARACINIZ İÇİN BİLDİRİM:\n\n" + metin })
    })
    .then(res => res.json())
    .then(data => {
      if(data.ok) {
        durum.style.color = "green";
        durum.innerText = "✅ Bildirim iletildi!";
      } else {
        durum.style.color = "red";
        durum.innerText = "❌ Hata: " + data.description;
      }
    })
    .catch(err => {
      durum.style.color = "red";
      durum.innerText = "❌ Bağlantı hatası!";
    });
  }
</script>

</body>
</html>

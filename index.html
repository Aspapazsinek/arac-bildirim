<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>01 UA 852 - Araç Sahibine Ulaş</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      text-align: center;
      padding: 20px;
      background-color: #eef2f5;
      margin: 0;
    }
    .card {
      background: white;
      padding: 30px 20px;
      border-radius: 16px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.1);
      max-width: 380px;
      margin: 30px auto;
      border: 3px solid #e63946;
    }
    .plaka {
      background-color: #fff;
      border: 2px solid #000;
      border-radius: 6px;
      display: inline-flex;
      align-items: center;
      margin-bottom: 15px;
      overflow: hidden;
      font-weight: bold;
    }
    .plaka-tr {
      background-color: #003399;
      color: white;
      padding: 6px 8px;
      font-size: 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .plaka-no {
      padding: 4px 15px;
      font-size: 22px;
      color: #000;
      letter-spacing: 2px;
    }
    h2 { color: #1a1a1a; margin-bottom: 8px; font-size: 20px; }
    p { color: #666; font-size: 14px; margin-bottom: 20px; }
    
    .btn-msg {
      width: 100%;
      padding: 14px;
      margin: 6px 0;
      border: none;
      border-radius: 10px;
      background-color: #0088cc;
      color: white;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .btn-msg:active { background-color: #006699; transform: scale(0.98); }
    
    .btn-call {
      display: block;
      width: 100%;
      padding: 14px 0;
      margin-top: 15px;
      border-radius: 10px;
      background-color: #28a745;
      color: white;
      font-size: 16px;
      font-weight: bold;
      text-decoration: none;
      box-shadow: 0 4px 10px rgba(40,167,69,0.3);
      transition: all 0.2s ease;
    }
    .btn-call:active { background-color: #1e7e34; transform: scale(0.98); }

    #durum { margin-top: 15px; font-weight: bold; font-size: 15px; }
    hr { border: 0; height: 1px; background: #eee; margin: 20px 0; }
  </style>
</head>
<body>

<div class="card">
  <div class="plaka">
    <div class="plaka-tr">TR</div>
    <div class="plaka-no">01 UA 852</div>
  </div>

  <h2>🚘 Araç Sahibine Ulaş</h2>
  <p>Lütfen bildirim nedeninizi seçiniz:</p>
  
  <button class="btn-msg" onclick="mesajGonder('🚗 Hatalı Park / Yol Kapalı!')">🚗 Hatalı Park</button>
  <button class="btn-msg" onclick="mesajGonder('🚗 Aracınızı çeker misiniz? Çıkış yapamıyorum!')">🚗 Aracınızı Çeker Mısınız?</button>
  <button class="btn-msg" onclick="mesajGonder('💡 Far veya Cam Açık!')">💡 Far / Cam Açık</button>
  <button class="btn-msg" onclick="mesajGonder('🚨 Acil Durum!')">🚨 Acil Durum</button>
  <button class="btn-msg" onclick="mesajGonder('⚠️ Araç Çekiliyor!')">⚠️ Araç Çekiliyor</button>

  <div id="durum"></div>

  <hr>

  <a href="tel:05370600792" class="btn-call">📞 Doğrudan Ara (0537 060 07 92)</a>
</div>

<script>
  const TELEGRAM_TOKEN = "8983133222:AAGlc-Jc6BlFRxFDC_genU-ICp9k8A7rAVA";
  const CHAT_ID = "5056753936";

  function mesajGonder(mesaj) {
    const durumDiv = document.getElementById("durum");
    durumDiv.style.color = "#0088cc";
    durumDiv.innerText = "Gönderiliyor...";

    const url = `https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage`;
    
    fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        chat_id: CHAT_ID,
        text: "🚨 01 UA 852 BİLDİRİMİ!\n\nBildirim: " + mesaj
      })
    })
    .then(response => {
      if(response.ok) {
        durumDiv.style.color = "#2e7d32";
        durumDiv.innerText = "✅ Bildirim araç sahibine iletildi!";
      } else {
        durumDiv.style.color = "#c62828";
        durumDiv.innerText = "❌ Hata oluştu, tekrar deneyin.";
      }
    })
    .catch(() => {
      durumDiv.style.color = "#c62828";
      durumDiv.innerText = "❌ Bağlantı hatası!";
    });
  }
</script>

</body>
</html>
